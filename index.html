<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>MAIN DATA WEB APP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,sans-serif;background:#dfe3e8;color:#111}
    .app-shell{padding:6px}
    .panel{background:#efefef;border-radius:12px;padding:8px;margin-bottom:8px}
    .toolbar{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
    .toolbar-left,.toolbar-right{display:flex;gap:6px;flex-wrap:wrap;align-items:end}
    .filter-group{display:flex;flex-direction:column;gap:3px}
    .filter-group label{font-size:10px;font-weight:700}
    input,select{height:32px;border:1px solid #bbb;border-radius:7px;padding:6px;font-size:11px}
    .btn{border:0;border-radius:7px;padding:8px 12px;height:32px;color:#fff;font-size:11px;font-weight:700;cursor:pointer}
    .btn-print{background:#f57c00}.btn-refresh{background:#6c727a}.btn-entry{background:#5b4bdb}
    .btn-save{background:#2e7d32}.btn-cancel{background:#757575}.btn-delete{background:#d32f2f}
    .table-wrap{overflow:auto;background:#fff;border:1px solid #ccc;border-radius:10px;max-height:calc(100vh - 120px)}
    table{border-collapse:collapse;width:max-content;min-width:100%}
    th,td{border:1px solid #444;padding:4px 5px;font-size:10px;text-align:center;white-space:nowrap}
    th{position:sticky;top:0;background:#12dfb3;z-index:2}
    .check-col{position:sticky;left:0;background:#fff;z-index:1}
    th.check-col{background:#12dfb3;z-index:3}
    .action-cell{position:sticky;right:0;background:#fff;z-index:1}
    th.action-cell{background:#12dfb3;z-index:3}
    .loading{text-align:center;padding:20px;font-size:13px}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:9999}
    .modal.show{display:flex}
    .modal-box{background:#fff;border-radius:14px;padding:18px;width:min(420px,94%)}
    .modal-title{margin:0 0 10px;font-size:18px}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
    .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:8px 18px;border-radius:20px;color:#fff;font-size:12px;font-weight:700;z-index:99999}
  </style>
</head>

<body>
<div class="app-shell">
  <div class="panel">
    <div class="toolbar">
      <div class="toolbar-left">
        <div class="filter-group">
          <label>SEARCH</label>
          <input id="searchBox" placeholder="Search..." oninput="applyFilters()">
        </div>

        <div class="filter-group">
          <label>YEAR</label>
          <select id="yearSel" onchange="populateMonths();applyFilters()"></select>
        </div>

        <div class="filter-group">
          <label>MONTH</label>
          <select id="monthSel" onchange="applyFilters()"></select>
        </div>

        <button class="btn btn-refresh" onclick="loadData()">Refresh</button>
      </div>

      <div class="toolbar-right">
        <button class="btn btn-print" onclick="printSelected()">Print Selected</button>
      </div>
    </div>
  </div>

  <div class="panel">
    <div id="tableWrap" class="table-wrap">
      <div class="loading">Loading...</div>
    </div>
  </div>
</div>

<!-- Print Copy Modal -->
<div class="modal" id="printCopyModal">
  <div class="modal-box">
    <h3 class="modal-title">Print Copy</h3>
    <p>How many COPY?</p>
    <input id="printCopyInput" type="number" min="1" value="3" style="width:100%;height:38px;font-size:14px">
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closePrintCopyModal()">Cancel</button>
      <button class="btn btn-print" onclick="confirmPrintCopy()">Print</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxwY7OL6A9FSB9PvDaLTcjTEh4tDWFyvIRlwSjv7PhbGWgrwK_BkuNwZeApw7UaHXvM/exec';

let DATA = {};
let allRows = [];
let filteredRows = [];
let selectedIds = {};
let printRows = [];

const DISPLAY_HEADERS = [
  'BUYER','STYLE','PO','COUNTRY','COLOR','Order Qty','Ship +merged Qty','Merged Qty',
  'Short','Excess','Short %','Excess %','ASSORT CTN','SOLID CTN','MIXED CTN','TOTAL CTN',
  'SHIP MODE','Remarks','CUTOFF','MONTH','TOD DATE','SHIP DATE','STATUS'
];

function api(action, payload){
  return fetch(API_URL, {
    method:'POST',
    body: JSON.stringify({action:action, payload:payload || {}})
  }).then(r => r.json()).then(res => {
    if(!res.success) throw new Error(res.message || 'API error');
    return res.data;
  });
}

function escapeHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function num(v){
  var n = Number(String(v||0).replace(/,/g,''));
  return isNaN(n) ? 0 : n;
}

function fnum(v){
  return num(v).toLocaleString();
}

function toast(msg,color){
  let t=document.createElement('div');
  t.className='toast';
  t.style.background=color||'#333';
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),2200);
}

function loadData(){
  document.getElementById('tableWrap').innerHTML='<div class="loading">Loading...</div>';
  api('getMainData').then(d=>{
    DATA=d;
    allRows=d.rows || [];
    setupFilters();
    applyFilters();
  }).catch(e=>{
    document.getElementById('tableWrap').innerHTML='<div class="loading">Error: '+escapeHtml(e.message)+'</div>';
  });
}

function setupFilters(){
  let f=DATA.filters || {};
  let yearSel=document.getElementById('yearSel');
  yearSel.innerHTML='<option value="">All</option>'+(f.years||[]).map(y=>'<option value="'+y+'">'+y+'</option>').join('');
  yearSel.value=f.currentYear || '';

  populateMonths();
}

function populateMonths(){
  let year=document.getElementById('yearSel').value;
  let months=((DATA.filters||{}).monthsByYear||{})[year] || [];
  let monthSel=document.getElementById('monthSel');
  monthSel.innerHTML='<option value="">All</option>'+months.map(m=>'<option value="'+m+'">'+m+'</option>').join('');
  monthSel.value=(((DATA.filters||{}).defaultMonthByYear||{})[year]) || '';
}

function applyFilters(){
  let q=(document.getElementById('searchBox').value||'').toLowerCase();
  let year=document.getElementById('yearSel').value;
  let month=document.getElementById('monthSel').value;

  filteredRows=allRows.filter(r=>{
    if(year && r.YEAR!==year) return false;
    if(month && r.MONTH!==month) return false;
    if(q){
      let hay=(r.BUYER+' '+r.STYLE+' '+r.PO+' '+r.COUNTRY+' '+r.COLOR).toLowerCase();
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });

  renderTable();
}

function renderTable(){
  let wrap=document.getElementById('tableWrap');
  if(!filteredRows.length){
    wrap.innerHTML='<div class="loading">No data found</div>';
    return;
  }

  let allChecked=filteredRows.every(r=>selectedIds[r.__rowNumber]);

  let html='<table><thead><tr>';
  html+='<th class="check-col"><input type="checkbox" '+(allChecked?'checked':'')+' onchange="toggleAll(this.checked)"></th>';
  DISPLAY_HEADERS.forEach(h=>html+='<th>'+escapeHtml(h)+'</th>');
  html+='<th class="action-cell">Actions</th></tr></thead><tbody>';

  filteredRows.forEach(r=>{
    let rn=r.__rowNumber;
    html+='<tr>';
    html+='<td class="check-col"><input type="checkbox" '+(selectedIds[rn]?'checked':'')+' onchange="toggleRow('+rn+',this.checked)"></td>';

    DISPLAY_HEADERS.forEach(h=>{
      let val=r[h] || '';
      html+='<td>'+(typeof val==='number' || ['Order Qty','TOTAL CTN','Short','Excess'].indexOf(h)>=0 ? fnum(val) : escapeHtml(val))+'</td>';
    });

    html+='<td class="action-cell"><button class="btn btn-print" onclick="printRow('+rn+')">🖨️</button></td>';
    html+='</tr>';
  });

  html+='</tbody></table>';
  wrap.innerHTML=html;
}

function toggleAll(checked){
  filteredRows.forEach(r=>{
    if(checked) selectedIds[r.__rowNumber]=true;
    else delete selectedIds[r.__rowNumber];
  });
  renderTable();
}

function toggleRow(rn,checked){
  if(checked) selectedIds[rn]=true;
  else delete selectedIds[rn];
}

function openPrintCopyModal(rows){
  printRows=rows || [];
  document.getElementById('printCopyInput').value='3';
  document.getElementById('printCopyModal').classList.add('show');
  setTimeout(()=>{
    document.getElementById('printCopyInput').focus();
    document.getElementById('printCopyInput').select();
  },100);
}

function closePrintCopyModal(){
  document.getElementById('printCopyModal').classList.remove('show');
  printRows=[];
}

function printRow(rn){
  openPrintCopyModal([rn]);
}

function printSelected(){
  let rns=Object.keys(selectedIds).map(Number).filter(Boolean);
  if(!rns.length){
    toast('No rows selected','#f57c00');
    return;
  }
  openPrintCopyModal(rns);
}

function confirmPrintCopy(){
  let copies=parseInt(document.getElementById('printCopyInput').value,10);
  if(!copies || copies<1) copies=3;

  let rns=printRows.slice();
  closePrintCopyModal();

  toast('Preparing print...','#ef6c00');

  api('getPrintData',{rowNumbers:rns}).then(items=>{
    if(!items || !items.length){
      toast('No print data','#d32f2f');
      return;
    }

    let duplicated=[];
    items.forEach(item=>{
      for(let i=0;i<copies;i++){
        duplicated.push(JSON.parse(JSON.stringify(item)));
      }
    });

    let w=window.open('','_blank');
    if(!w){
      toast('Popup blocked! Allow popups.','#d32f2f');
      return;
    }

    w.document.write(buildPrintDocument(duplicated));
    w.document.close();
  }).catch(e=>{
    toast('Print failed: '+e.message,'#d32f2f');
  });
}

function buildPrintDocument(items){
  let pages=items.map(item=>'<div class="page">'+renderPrintBlock(item)+'</div>').join('');

  return `
<!DOCTYPE html>
<html>
<head>
<title>Print</title>
<style>
*{box-sizing:border-box}
@page{size:A4 portrait;margin:8mm}
body{margin:0;font-family:Arial,sans-serif;color:#000}
.page{page-break-after:always;width:100%;max-width:780px;margin:0 auto}
.top{text-align:center;position:relative;min-height:130px}
h1{font-size:18px;margin:0}
h2{font-size:14px;margin:4px 0}
h3{font-size:16px;margin:6px 0}
.logo{position:absolute;top:0;right:0;width:160px;height:100px}
.logo img{max-width:155px;max-height:95px}
.info{text-align:left;display:inline-block;font-size:11px;font-weight:700;line-height:1.6}
table{width:100%;border-collapse:collapse;margin-top:8px}
th,td{border:1px solid #000;padding:3px 4px;font-size:9px;text-align:center}
th{background:#12dfb3}
.qs{text-align:center;font-weight:800;text-decoration:underline;margin-top:20px}
</style>
</head>
<body>
${pages}
<script>
window.onload=function(){setTimeout(function(){window.print()},250)}
<\/script>
</body>
</html>`;
}

function renderPrintBlock(item){
  let total=item.total || {};
  let rows=(item.countryRows || []).map(r=>`
<tr>
<td>${escapeHtml(r.country)}</td>
<td>${escapeHtml(r.color)}</td>
<td>${fnum(r.orderQty)}</td>
<td>${fnum(r.shipMergedQty)}</td>
<td>${fnum(r.mergedQty)}</td>
<td>${fnum(r.short)}</td>
<td>${fnum(r.excess)}</td>
<td>${escapeHtml(r.shortPct)}</td>
<td>${escapeHtml(r.excessPct)}</td>
<td>${fnum(r.assort)}</td>
<td>${fnum(r.solid)}</td>
<td>${fnum(r.mixed)}</td>
<td>${fnum(r.ctn)}</td>
<td>${escapeHtml(r.shipMode)}</td>
<td>${escapeHtml(r.remarks)}</td>
</tr>`).join('');

  return `
<div class="top">
  <h1>${escapeHtml(item.companyName)}</h1>
  <h2>${escapeHtml(item.unitName)}</h2>
  <h3>${escapeHtml(item.summaryTitle)}</h3>
  <div class="info">
    <div>BUYER: ${escapeHtml(item.buyer)}</div>
    <div>STYLE: ${escapeHtml(item.style)}</div>
    <div>PO NO: ${escapeHtml(item.po)}</div>
    <div>O/QTY: ${fnum(item.orderQty)}</div>
    <div>TOD DATE: ${escapeHtml(item.todDate)}</div>
    <div>FINAL INS. DATE: ${escapeHtml(item.finalInsDate)}</div>
  </div>
  <div class="logo">${item.logo?'<img src="'+item.logo+'">':''}</div>
</div>

<table>
<tr>
<th>COUNTRY</th><th>COLOR</th><th>Order Qty</th><th>Ship +merged Qty</th><th>Merged Qty</th>
<th>Short</th><th>Excess</th><th>SHORT %</th><th>EXCESS %</th>
<th>ASSORT</th><th>SOLID</th><th>MIXED</th><th>CTN</th><th>SHIP MODE</th><th>Remarks</th>
</tr>
${rows}
<tr>
<td><b>TOTAL</b></td><td></td>
<td><b>${fnum(total.orderQty)}</b></td>
<td><b>${fnum(total.shipMergedQty)}</b></td>
<td><b>${fnum(total.mergedQty)}</b></td>
<td><b>${fnum(total.short)}</b></td>
<td><b>${fnum(total.excess)}</b></td>
<td><b>${escapeHtml(total.shortPct)}</b></td>
<td><b>${escapeHtml(total.excessPct)}</b></td>
<td><b>${fnum(total.assort)}</b></td>
<td><b>${fnum(total.solid)}</b></td>
<td><b>${fnum(total.mixed)}</b></td>
<td><b>${fnum(total.ctn)}</b></td>
<td></td><td></td>
</tr>
</table>

<div class="qs">QS</div>
<table>
<tr><th>PERTICULARS</th><th>OK</th><th>Inspection type</th><th>OK</th><th>CUTTING</th></tr>
<tr><td>P / S</td><td></td><td>Initial</td><td></td><td>SEWING</td></tr>
<tr><td>W / T</td><td></td><td>Inline</td><td></td><td>FINISHING</td></tr>
<tr><td>TOD</td><td></td><td>Final</td><td></td><td>PACK</td></tr>
</table>`;
}

loadData();
</script>
</body>
</html>
